[project]
name = "chess-war"
version = "0.1.0"
description = "Laya (local) vs Jev (TypeSafe API) playing pixel-art chess through identical typed questions."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.11",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chess-war = "chesswar.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chesswar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
